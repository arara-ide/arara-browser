<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arara Browser</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="arara.svg" alt="" width="32" height="32">
      <h1>Arara Browser</h1>
      <span id="connection" role="status" data-i18n="disconnected"></span>
    </header>
    <div id="pairing">
      <p id="instructions" data-i18n="instructions"></p>
      <label for="code" data-i18n="codeLabel"></label>
      <div class="code-field">
        <input id="code" type="password" autocomplete="off" spellcheck="false" aria-describedby="instructions">
      </div>
    </div>
    <div class="actions">
      <button id="connect" data-connected="false" data-i18n="connect"></button>
      <button id="show" class="secondary" aria-controls="code" data-i18n="show"></button>
      <button id="sites" class="secondary" hidden data-i18n="allowSites"></button>
    </div>
    <p id="status" role="status"></p>
    <footer>
      <small id="update-status" role="status"></small>
      <button id="update" class="secondary" hidden data-i18n="outdatedDownload"></button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
